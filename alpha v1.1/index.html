<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Gloe Animate</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--bg:#14161d;--panel:#1d2029;--line:#2c3040;--tx:#e6e8ef;--mut:#8a90a3;--ac:#ffb547;--ink:#1a1204}
*{box-sizing:border-box}:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.3 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{color:var(--ac);margin-right:10px;font-size:16px;letter-spacing:.3px}
.sp{width:1px;height:20px;background:var(--line);margin:0 6px}
button,input{font:inherit;color:var(--tx);background:#292d3a;border:1px solid var(--line);border-radius:5px;padding:4px 9px}
button{cursor:pointer}button:hover{background:#343949}
button.on{background:var(--ac);border-color:var(--ac);color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input[type=color]{padding:0;width:30px;height:26px}
input[type=number]{width:64px}
#main{flex:1;display:flex;min-height:0}
#tools{width:54px;padding:6px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#tools button{padding:7px 0;font-size:16px}
#stagewrap{flex:1;min-height:0;min-width:0;display:flex;overflow:auto;background:#0d0e13}
canvas{margin:auto;flex:none;background:#fff;box-shadow:0 0 0 1px #000,0 10px 40px #000a;touch-action:none;cursor:crosshair}
#props{width:200px;padding:10px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#props.dim .sh label{opacity:.45}
#props label{display:flex;justify-content:space-between;align-items:center;color:var(--mut)}
#tl{height:220px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
#tlbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--line)}
#flab{min-width:96px;color:var(--ac)}
#grid{flex:1;overflow:auto}
.row{display:flex;height:24px;border-bottom:1px solid var(--line);width:max-content;min-width:100%}
.name{position:sticky;left:0;z-index:2;width:120px;min-width:120px;background:var(--panel);padding:4px 8px;border-right:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden}
.name.sel{color:var(--ac);font-weight:600}
.c{width:14px;min-width:14px;border-right:1px solid #262a37;position:relative;cursor:pointer}
.c.five{background:#232634}
.c.t{background:#ffb54733}
.c.cur{background:#ffb54766}
.c.k::after{content:"";position:absolute;left:3px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--tx)}
.head .c{height:18px;font-size:9px;color:var(--mut);text-align:center;cursor:default}
#props hr{border:0;border-top:1px solid var(--line);width:100%;margin:2px 0}
#bProps{display:none}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#dlg,#xdlg{position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}
#dlg[hidden],#xdlg[hidden]{display:none}
#dlg .box,#xdlg .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;width:min(520px,100%);display:flex;flex-direction:column;gap:8px}
#dlg textarea{height:200px;font:11px monospace;background:#0d0e13;color:var(--tx);border:1px solid var(--line);border-radius:5px}
#toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--ink);padding:6px 12px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
.name input{width:84px;padding:0 4px}
@media (max-width:820px){
 header{flex-wrap:nowrap;overflow-x:auto}header>*{flex:none}
 button,input{min-height:34px}
 #main{flex-direction:column}
 #tools{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
 #tools button{flex:1;min-width:44px}
 #bProps,#bLib{display:block}
 #props{display:none;position:fixed;left:0;right:0;bottom:0;width:auto;max-height:55%;overflow:auto;z-index:10;border:0;border-top:1px solid var(--ac)}
 #props.open{display:flex}
 #tl{height:auto;max-height:46%}
 #tlbar{flex-wrap:nowrap;overflow-x:auto}#tlbar>*{flex:none}
 #grid{min-height:72px}
 .c{width:18px;min-width:18px}
 .name{width:104px;min-width:104px}
}
#bTLt{display:none}
@media (max-height:560px){
 header{flex-wrap:nowrap;overflow-x:auto;padding:3px 8px}header>*{flex:none}
 header b{font-size:14px;margin-right:4px}
 button,input{min-height:30px;padding:2px 8px}
 #main{flex-direction:row}
 #tools{width:54px;flex-direction:column;overflow-y:auto;border-right:1px solid var(--line);border-bottom:0}
 #tools button{flex:none;min-width:0}
 #bTLt,#bProps,#bLib{display:block}
 #tl{height:auto}
 #tlbar{flex-wrap:nowrap;overflow-x:auto;padding:3px 8px}#tlbar>*{flex:none}
 #grid{max-height:78px}
 body.tlmin #grid{display:none}
 #props{max-height:75%}
}
.name.in{padding-left:22px}
.row.grow .name{font-weight:600;background:#232634}
button{white-space:nowrap}
#dMed{display:none;justify-content:center;overflow:auto}#dMed.on{display:flex}
#xdlg label{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mut)}
#xdlg select{font:inherit;color:var(--tx);background:#292d3a;border:1px solid var(--line);border-radius:5px;padding:4px 8px}
#xdlg input[type=number]{width:70px}
#stagebox{flex:1;min-height:0;min-width:0;display:flex;position:relative}
#selbar{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;display:none;gap:6px;background:var(--panel);border:1px solid var(--ac);border-radius:8px;padding:6px;z-index:5;box-shadow:0 6px 20px #0008}
#selbar.on{display:flex}
#selbar #sbSym,#selbar #sbBrk{background:var(--ac);border-color:var(--ac);color:var(--ink);font-weight:600}
#libp{width:200px;padding:10px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px;overflow:auto}
.lh{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.lf{padding:2px;border-radius:6px}.lf.drop{outline:2px solid var(--ac)}
#lib{display:flex;flex-direction:column;gap:6px}
.ls{border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:6px;background:#232634}
.ls.in{margin-left:12px}.lh{display:flex;gap:8px;align-items:center}
#libp select{max-width:96px;min-height:30px;font:inherit;color:var(--tx);background:#292d3a;border:1px solid var(--line);border-radius:5px}
#bLib{display:none}
@media (max-width:820px){#libp{display:none;position:fixed;left:0;right:0;bottom:0;width:auto;max-height:55%;z-index:10;border:0;border-top:1px solid var(--ac)}#libp.open{display:flex}}
@media (max-height:560px){#libp{max-height:75%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script></head>
<body>
<header>
 <b>Gloe Animate <small style="font-size:11px;color:var(--mut);font-weight:400">alpha 1.1</small></b>
 <button id="bNew">New</button><button id="bOpen">Open .gle</button><button id="bSave">Save .gle</button><button id="bUndo">Undo</button><button id="bPaste">Paste project</button>
 <input id="file" type="file" hidden>
 <span class="sp"></span>
 <button id="bExp">Export…</button>
 <span class="sp"></span>
 Fill <input id="fill" type="color" value="#ffb547"><label><input id="nofill" type="checkbox"> none</label>
 Stroke <input id="stroke" type="color" value="#1a1204"> Width <input id="sw" type="number" min="0" max="40" value="3">
</header>
<div id="main">
 <div id="tools">
  <button data-t="select" title="Select / move (V)">↖</button>
  <button data-t="brush" title="Brush (B)">✎</button>
  <button data-t="line" title="Line (L)">╱</button>
  <button data-t="rect" title="Rectangle (R)">▭</button>
  <button data-t="ell" title="Ellipse (E)">◯</button>
  <button data-t="cam" title="Camera (C)">🎥</button>
  <button data-t="pick" title="Eyedropper (I)">💧</button>
  <button data-t="erase" title="Eraser (X)">⌫</button>
  <button data-t="bucket" title="Paint bucket (K)">🪣</button>
  <button id="bTLt" title="Show or hide the timeline">⏱</button>
  <button id="bProps">Props</button>
  <button id="bLib">Library</button>
 </div>
 <div id="stagebox"><div id="stagewrap"><canvas id="cv" width="800" height="500"></canvas></div>
  <div id="selbar"><button id="sbSym">Make symbol</button><button id="sbBrk">Break apart</button><button id="sbDup">Duplicate</button><button id="sbDel">Delete</button></div></div>
 <div id="libp"><div class="bar"><b style="flex:1">Library</b><button id="lNewF">New folder</button></div><div id="lib"></div></div>
 <div id="props">
  <div class="sh" style="display:flex;flex-direction:column;gap:8px">
   <b>Selected shape</b>
   <label>X <input id="px" type="number"></label>
   <label>Y <input id="py" type="number"></label>
   <label>Width <input id="pw" type="number"></label>
   <label>Height <input id="ph" type="number"></label>
   <label>Rotation <input id="prot" type="number"></label>
   <label>Opacity <input id="pop" type="number" step="0.1" min="0" max="1"></label>
   <div class="bar"><button id="aAll">Select all</button><button id="aDup">Duplicate</button><button id="aDel">Delete</button><button id="aFwd">Front</button><button id="aBack">Back</button><button id="aFlip">Flip</button><button id="aSym">Make symbol</button><button id="aBrk">Break apart</button></div>
  </div>
  <hr>
  <b>Camera</b>
  <label>X <input id="cx" type="number"></label>
  <label>Y <input id="cy" type="number"></label>
  <label>Zoom % <input id="cz" type="number" min="10" max="800"></label>
  <label>Rotation <input id="cr" type="number"></label>
  <div style="display:flex;gap:6px"><button id="zOut">−</button><button id="zIn">＋</button><button id="cReset">Reset</button></div>
  <small style="color:var(--mut)">Pick the camera tool and drag the stage to pan. Add keyframes on the Camera row to move or zoom over time.</small>
  <hr><b>Stage</b>
  <label>Width <input id="stW" type="number"></label>
  <label>Height <input id="stH" type="number"></label>
  <label>Background <input id="stBg" type="color" value="#ffffff"></label>
  <div class="bar"><button id="sLand">Landscape</button><button id="sPort">Phone portrait</button><button id="sSq">Square</button></div>
 </div>
</div>
<div id="tl">
 <div id="tlbar">
  <button id="bFirst" title="First frame">⏮</button><button id="play" title="Play (Space)">▶</button><button id="bLoop" class="on" title="Loop playback">Loop</button>
  <span id="flab"></span>
  FPS <input id="fps" type="number" min="1" max="60">
  Frames <input id="frames" type="number" min="2" max="300">
  <span class="sp"></span>
  <button id="bAddL">Add layer</button><button id="bDelL">Delete layer</button><button id="bRen">Rename layer</button><button id="bGrp">Group</button><button id="bUngrp">Ungroup</button><button id="bUp">Layer ▲</button><button id="bDn">Layer ▼</button><button id="bLock">Lock layer</button><button id="bMask">Mask layer</button><button id="bFin">+ Frame</button><button id="bFrm">− Frame</button>
  <button id="bKey" title="F6">Add keyframe</button><button id="bDelK" title="Shift+F6">Remove keyframe</button>
  <button id="bTween">Tween: on</button><button id="bOnion">Onion skin</button><button id="bEase">Ease: linear</button>
 </div>
 <div id="grid"></div>
</div>
<div id="toast"></div>
<div id="xdlg" hidden><div class="box">
 <b>Export</b><span id="xInfo" style="color:var(--mut)"></span>
 <label>Format <select id="xFmt"><option value="mp4">MP4 video</option><option value="gif">Animated GIF</option><option value="png">PNG image (this frame)</option><option value="zip">PNG sequence (.zip)</option><option value="sheet">Sprite sheet (PNG)</option></select></label>
 <label>Size <select id="xScale"><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option><option value="0.25">25%</option></select></label>
 <label>Frames <span><input id="xFrom" type="number" min="1"> to <input id="xTo" type="number" min="1"></span></label>
 <label>Frame rate <input id="xFps" type="number" min="1" max="60"></label>
 <label>Quality <select id="xQ"><option value="0.05">Draft</option><option value="0.1" selected>Standard</option><option value="0.2">High</option></select></label>
 <span id="xOut"></span><span id="xProg" style="color:var(--ac)"></span>
 <div class="bar"><button id="xGo">Export</button><button id="xX">Close</button></div>
</div></div>
<div id="dlg" hidden><div class="box"><b id="dT"></b><span id="dM" style="color:var(--mut)"></span><div id="dMed"></div><textarea id="dTa"></textarea><div class="bar"><button id="dGo">Load</button><button id="dCopy">Copy</button><button id="dX">Close</button></div></div></div>
<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'),mainCtx=cv.getContext('2d');let ctx=mainCtx;
const tmp=document.createElement('canvas'),tctx=tmp.getContext('2d'),mtmp=document.createElement('canvas'),mctx=mtmp.getContext('2d');let loop=true,selG=null;
let doc,cur=0,li=0,sel=null,tool='select',playing=false,timer=null,undo=[],drag=null,noSel=false;
let sels=[],clip=[],marq=null,ghost=1,onion=false;
const uid=()=>Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const lerp=(a,b,t)=>a+(b-a)*t;

function newDoc(demo){
 const ball=(x,y,w)=>({id:'ball',t:'ell',x,y,w,h:w,rot:0,op:1,fill:'#ffb547',stroke:'#1a1204',sw:4});
 doc={app:'Gloe Animate',v:1,w:800,h:500,fps:12,frames:48,layers:[{name:'Layer 1',vis:true,keys:demo?
  {0:{tween:true,objs:[ball(150,250,90)]},24:{tween:true,objs:[ball(650,300,150)]},47:{tween:true,objs:[ball(150,250,90)]}}:
  {0:{tween:true,objs:[]}}}]};
 cur=0;li=0;setSel([]);undo=[];fit();
}
function fitView(){const r=$('#stagewrap').getBoundingClientRect(),k=Math.max(.1,Math.min((r.width-16)/doc.w,(r.height-16)/doc.h));cv.style.width=doc.w*k+'px';cv.style.height=doc.h*k+'px'}
function fit(){cv.width=doc.w;cv.height=doc.h;if(!doc.syms)doc.syms={};if(!doc.groups)doc.groups={};if(!doc.symFolders)doc.symFolders={};fitView();if(!doc.cam)doc.cam={name:'Camera',vis:true,keys:{0:{tween:true,objs:[{id:'cam',x:doc.w/2,y:doc.h/2,w:doc.w,h:doc.h,rot:0,op:1}]}}}}
const camAt=f=>objsAt(doc.cam,f)[0]||{x:doc.w/2,y:doc.h/2,w:doc.w,h:doc.h,rot:0};
const Lcur=()=>li<0?doc.cam:doc.layers[li];
function push(){undo.push(JSON.stringify(doc));if(undo.length>60)undo.shift()}
function undoDo(){if(!undo.length)return;doc=JSON.parse(undo.pop());li=Math.min(li,doc.layers.length-1);cur=Math.min(cur,doc.frames-1);setSel([]);fit();refresh()}

/* timeline model */
const keysOf=L=>Object.keys(L.keys).map(Number).sort((a,b)=>a-b);
function prevKey(L,f){let r=null;for(const k of keysOf(L))if(k<=f)r=k;return r}
function nextKey(L,f){for(const k of keysOf(L))if(k>f)return k;return null}
function ease(m,t){return m==='in'?t*t:m==='out'?1-(1-t)*(1-t):m==='both'?t*t*(3-2*t):t}
function objsAt(L,f){
 const p=prevKey(L,f);if(p===null)return[];
 const A=L.keys[p].objs,n=nextKey(L,f);
 if(!L.keys[p].tween||n===null)return A;
 const t=ease(L.keys[p].ease,(f-p)/(n-p)),B=L.keys[n].objs;
 return A.map(a=>{const b=B.find(o=>o.id===a.id);if(!b)return a;const o={...a};
  for(const k of['x','y','w','h','rot','op'])o[k]=lerp(a[k],b[k],t);return o});
}
function ensureKey(L,f){
 if(L.keys[f])return L.keys[f];
 const p=prevKey(L,f);
 L.keys[f]={tween:true,objs:p===null?[]:clone(objsAt(L,f))};
 return L.keys[f];
}

/* drawing */
function bounds(o){
 if(o.t==='path'){const xs=o.pts.map(p=>p[0]),ys=o.pts.map(p=>p[1]),m=o.sw/2+3;
  return[Math.min(...xs)-m,Math.min(...ys)-m,Math.max(...xs)+m,Math.max(...ys)+m]}
 return[-o.w/2,-o.h/2,o.w/2,o.h/2];
}
function toLocal(o,p){const dx=p.x-o.x,dy=p.y-o.y,a=o.rot*Math.PI/180;return{x:dx*Math.cos(a)+dy*Math.sin(a),y:-dx*Math.sin(a)+dy*Math.cos(a)}}
function handlesOf(o){const b=bounds(o),a=o.rot*Math.PI/180,c=Math.cos(a),n=Math.sin(a),k=doc.w/camAt(cur).w;
 return[['a',b[0],b[1]],['a',b[2],b[1]],['a',b[2],b[3]],['a',b[0],b[3]],['r',0,b[1]-30/k]].map(([t,x,y])=>({k:t,x:o.x+x*c-y*n,y:o.y+x*n+y*c}))}
function handleAt(p){const o=selObjs();if(o.length!==1)return null;const k=doc.w/camAt(cur).w;
 const h=handlesOf(o[0]).find(h=>Math.hypot(h.x-p.x,h.y-p.y)<16/k);return h?h.k:null}
function selObjs(){return li<0?[]:objsAt(doc.layers[li],cur).filter(o=>sels.includes(o.id))}
function setSel(a){sels=a;sel=a.length?a[a.length-1]:null}
function hit(o,x,y){
 const dx=x-o.x,dy=y-o.y,a=o.rot*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
 const lx=dx*c+dy*s,ly=-dx*s+dy*c,b=bounds(o);
 return lx>=b[0]&&lx<=b[2]&&ly>=b[1]&&ly<=b[3];
}
function camT(c,m){const k=doc.w/m.w;c.translate(doc.w/2,doc.h/2);c.scale(k,k);c.rotate(-m.rot*Math.PI/180);c.translate(-m.x,-m.y)}
function drawLayers(f){
 const LS=doc.layers,cm=camAt(cur);
 for(let j=LS.length-1;j>=0;j--){
  const L=LS[j],GG=L.g&&doc.groups[L.g];if(!L.vis||(GG&&GG.vis===false))continue;
  if(L.mask){if(j===li&&!playing&&!noSel){ghost=.35;objsAt(L,f).forEach(drawObj);ghost=1}continue}
  const M=LS[j-1];
  if(M&&M.mask&&M.vis){
   if(tmp.width!==doc.w||tmp.height!==doc.h){tmp.width=mtmp.width=doc.w;tmp.height=mtmp.height=doc.h}else{tctx.clearRect(0,0,doc.w,doc.h);mctx.clearRect(0,0,doc.w,doc.h)}
   const keep=ctx;
   ctx=tctx;ctx.save();camT(ctx,cm);objsAt(L,f).forEach(drawObj);ctx.restore();
   ctx=mctx;ctx.save();camT(ctx,cm);objsAt(M,f).forEach(o=>drawObj({...o,fill:o.fill==='none'?'#000':o.fill,op:1}));ctx.restore();
   ctx=tctx;ctx.globalCompositeOperation='destination-in';ctx.drawImage(mtmp,0,0);ctx.globalCompositeOperation='source-over';
   ctx=keep;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(tmp,0,0);ctx.restore();
  }else objsAt(L,f).forEach(drawObj);
 }
}
function drawObj(o){
 ctx.save();ctx.globalAlpha=o.op*ghost;ctx.translate(o.x,o.y);ctx.rotate(o.rot*Math.PI/180);
 if(o.t==='sym'){const S=doc.syms[o.sid];if(S){ctx.scale(o.w/S.w0,o.h/S.h0);const g=ghost;ghost=g*o.op;S.objs.forEach(drawObj);ghost=g}ctx.restore();return}
 ctx.fillStyle=o.fill;ctx.strokeStyle=o.stroke;ctx.lineWidth=o.sw;ctx.lineCap=ctx.lineJoin='round';ctx.beginPath();
 if(o.t==='rect')ctx.rect(-o.w/2,-o.h/2,o.w,o.h);
 else if(o.t==='ell')ctx.ellipse(0,0,Math.abs(o.w/2),Math.abs(o.h/2),0,0,7);
 else o.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
 if(o.t!=='path'&&o.fill!=='none')ctx.fill();
 if(o.sw>0)ctx.stroke();
 ctx.restore();
}
function render(){
 ctx.fillStyle=doc.bg||'#fff';ctx.fillRect(0,0,doc.w,doc.h);
 const cm=camAt(cur),sc=doc.w/cm.w;ctx.save();ctx.translate(doc.w/2,doc.h/2);ctx.scale(sc,sc);ctx.rotate(-cm.rot*Math.PI/180);ctx.translate(-cm.x,-cm.y);
 if(onion&&!playing&&!noSel)[-2,-1,1,2].forEach(d=>{const f=cur+d;if(f<0||f>=doc.frames)return;ghost=Math.abs(d)==1?.3:.14;doc.layers.slice().reverse().forEach(L=>{if(L.vis)objsAt(L,f).forEach(drawObj)});ghost=1});
 drawLayers(cur);

 if(!playing&&!noSel&&li>=0){
  const so=selObjs();

function buildTL(){

 for(let f=0;f<doc.frames;f++)h+=`<div class="c ${f%5==4?'five':''}" data-f="${f}">${f%5==4?f+1:''}</div>`;
 h+='</div>';
 const seen=new Set();
 [doc.cam,...doc.layers].forEach((L,j)=>{
  const i=j-1,G=i>=0&&L.g?doc.groups[L.g]:null;
  if(G&&!seen.has(L.g)){seen.add(L.g);h+=`<div class="row grow"><div class="name ${selG===L.g?'sel':''}" data-g="${L.g}"><span data-tog="${L.g}">${G.open===false?'▸':'▾'}</span> <span data-geye="${L.g}">${G.vis===false?'○':'◉'}</span> 📁${G.lock?'🔒':''} ${esc(G.name)}</div>`+'<div class="c"></div>'.repeat(doc.frames)+'</div>'}
  if(G&&G.open===false)return;
  h+=`<div class="row"><div class="name ${i==li&&!selG?'sel':''}${G?' in':''}" data-l="${i}">${i<0?'🎥':`<span data-eye="${i}">${L.vis?'◉':'○'}</span>`} ${i<0?'Camera':(L.lock?'🔒':'')+(L.mask?'🎭':'')+esc(L.name)}</div>`;
  for(let f=0;f<doc.frames;f++){
   const p=prevKey(L,f),n=nextKey(L,f),c=['c'];
   if(f%5==4)c.push('five');
   if(L.keys[f])c.push('k');else if(p!==null&&n!==null&&L.keys[p].tween)c.push('t');
   if(f==cur)c.push('cur');
   h+=`<div class="${c.join(' ')}" data-l="${i}" data-f="${f}"></div>`;
  }

 });

}

async function dl(b,n){
 const d=window.claude&&claude.use?await Promise.resolve(claude.use('downloads')).catch(()=>null):null;
 if(d){
  try{
   try{await d.save({filename:n,data:b})}
   catch(e){if(e&&e.code==='rejected_extension')await d.save({filename:n+'.json',data:b});else throw e}
   toast('Saved');return true;
  }catch(e){if(e&&e.code==='declined')return true;toast('Save failed: '+((e&&e.code)||'error'));return false}
 }
 if(window.claude)return false;
 const C=window.Capacitor&&Capacitor.Plugins;
 if(C&&C.Filesystem&&C.Share){
  try{
   const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
   const f=await C.Filesystem.writeFile({path:n,data,directory:'CACHE'});
   await C.Share.share({title:n,url:f.uri,dialogTitle:'Save or send '+n});return true;
  }catch(e){if(/cancel/i.test((e&&e.message)||''))return true;toast('Save failed');return false}
 }
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);return true;
}

 }catch(e){if(e&&e.name==='AbortError')return}

}

    prog(i+1);await wait(enc.encodeQueueSize>5?20:0);
   }
   if(!xAbort){await enc.flush();if(err)throw err;mux.finalize();blob=new Blob([mux.target.buffer],{type:'video/mp4'});name='animation.mp4'}
  }
 }catch(e){toast((e&&e.message)||'Export failed');blob=null;xAbort=true}
 noSel=false;cur=keep;refresh();xBusy=false;$('#xGo').disabled=false;$('#xProg').textContent='';
 if(xAbort&&!blob){return}
 $('#xdlg').hidden=true;out(blob,name);
};
/* keyboard */
addEventListener('keydown',e=>{
 const tg=e.target;if(tg.tagName==='INPUT'&&tg.type!=='color'&&tg.type!=='checkbox')return;
 const k=e.key.toLowerCase();
 if(e.ctrlKey||e.metaKey){
  if(k==='z'){e.preventDefault();undoDo()}
  else if(k==='s'){e.preventDefault();save()}
  else if(k==='o'){e.preventDefault();$('#file').click()}
  else if(k==='a'){e.preventDefault();selectAll()}else if(k==='d'){e.preventDefault();dup()}else if(k==='c')copy();else if(k==='v')paste();
  return;
 }
 if(k===' '){e.preventDefault();play()}
 else if(e.key==='F6'){e.preventDefault();e.shiftKey?delKey():addKey()}
 else if(k==='.')go(cur+1);else if(k===',')go(cur-1);
 else if(k==='delete'||k==='backspace')delObj();
 else if(k==='escape'){setSel([]);refresh()}
 else if(k.startsWith('arrow')){e.preventDefault();const d=e.shiftKey?10:1;nudge(k==='arrowleft'?-d:k==='arrowright'?d:0,k==='arrowup'?-d:k==='arrowdown'?d:0)}
 else{const m={v:'select',b:'brush',l:'line',r:'rect',e:'ell',c:'cam',i:'pick',x:'erase',k:'bucket'}[k];if(m)setTool(m)}
});

new ResizeObserver(()=>fitView()).observe($('#stagewrap'));
newDoc(true);
try{const q=localStorage.getItem('gloe-autosave');if(q){const d=JSON.parse(q);if(d&&d.layers&&d.layers.length){doc=d;fit()}}}catch(_){}
setTool('select');refresh();
</script>
</body></html>
